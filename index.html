<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>

  <body>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أدوات طبيب الأسنان</title>
<style>
  :root{ --purple:#6c5ce7; --green:#4caf50; --red:#ff7675; --ink:#3a3a4a; --sub:#7c7c92; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; background:linear-gradient(135deg,#fef6e4 0%,#e8f4fd 100%); background-color:#fef6e4;
    font-family:"Tahoma","Segoe UI",Arial,sans-serif; direction:rtl; color:var(--ink);
    display:flex; justify-content:center; user-select:none; -webkit-user-select:none;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app{ width:100%; max-width:500px; min-height:100vh; display:flex; flex-direction:column; padding:16px 16px 24px; position:relative; }
  .sound-toggle{
    position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; width:40px; height:40px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.15); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:50;
  }
  .sound-toggle:active{transform:scale(.9);}
  header{text-align:center; padding-top:8px; margin-bottom:10px;}
  header h1{font-size:20px; margin:0 0 4px; font-weight:800;}
  header p{font-size:13px; margin:0; color:var(--sub);}

  .screen{display:none; flex:1; flex-direction:column;}
  .screen.active{display:flex;}

  .level-list{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .level-card{
    background:#fff; border-radius:18px; box-shadow:0 6px 18px rgba(0,0,0,.12); padding:18px 16px;
    display:flex; align-items:center; gap:14px; cursor:pointer; border:5px solid transparent; transition:transform .15s ease;
  }
  .level-card:active{transform:scale(.98);}
  .level-card .icon{font-size:34px; width:56px; height:56px; display:flex; align-items:center; justify-content:center; background:#f4f1ff; border-radius:16px; flex-shrink:0;}
  .level-card .txt{flex:1; text-align:right;}
  .level-card .txt h3{margin:0 0 4px; font-size:16px; font-weight:800;}
  .level-card .txt p{margin:0; font-size:13px; color:var(--sub);}
  .dots-mini{display:flex; gap:4px; margin-top:8px;}
  .dots-mini span{width:7px; height:7px; border-radius:50%; background:#e6e6ee;}
  .dots-mini span.done{background:var(--green);}

  .game-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .back-btn{border:none; background:#fff; border-radius:50%; width:36px; height:36px; box-shadow:0 3px 8px rgba(0,0,0,.1); font-size:16px; cursor:pointer;}
  .progress{display:flex; gap:8px;}
  .progress span{width:12px; height:12px; border-radius:50%; background:#e6e6ee; transition:transform .2s ease, background .2s ease;}
  .progress span.current{background:var(--purple); box-shadow:0 0 0 4px rgba(108,92,231,.25);}
  .progress span.done{background:var(--green); transform:scale(1.15);}

  .prompt-box{background:#fff; border-radius:16px; box-shadow:0 4px 14px rgba(0,0,0,.08); padding:14px; display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .prompt-box p{flex:1; margin:0; font-size:19px; font-weight:700; line-height:1.6; text-align:right;}
  .speak-btn{width:38px; height:38px; border-radius:50%; border:none; background:var(--purple); color:#fff; font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .speak-btn:active{transform:scale(.92);}
  .speak-btn.speaking{animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(108,92,231,.5);} to{box-shadow:0 0 0 10px rgba(108,92,231,0);}}

  .cards-wrap{display:flex; flex-direction:column; gap:12px;}
  .card{position:relative; background:#fff; border-radius:18px; box-shadow:0 6px 18px rgba(0,0,0,.12); border:5px solid transparent; overflow:hidden; cursor:pointer; transition:border-color .2s ease;}
  .card.locked{cursor:default;}
  .card img{display:block; width:100%; aspect-ratio:3/2; object-fit:cover; image-rendering:auto; pointer-events:none; -webkit-user-drag:none;}
  .card.correct{border-color:var(--green);}
  .card.wrong-flash{border-color:var(--red); animation:shake .4s ease;}
  @keyframes shake{0%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}100%{transform:translateX(0);}}
  .badge{position:absolute; top:8px; left:8px; width:38px; height:38px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; opacity:0; transform:scale(.4); transition:opacity .3s ease, transform .3s ease;}
  .badge.show{opacity:1; transform:scale(1);}
  .xmark{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .xmark.show{opacity:1;}
  .xmark span{font-size:64px; text-shadow:0 2px 6px rgba(0,0,0,.4);}

  /* المستوى الثاني (٣ صور): نفس مقاسات النشاط المرجعي */
  #gameArea.lvl-2 .prompt-box{padding:10px 14px; margin-bottom:10px;}
  #gameArea.lvl-2 .prompt-box p{font-size:17px;}
  #gameArea.lvl-2 .cards-wrap{gap:8px;}
  #gameArea.lvl-2 .card img{aspect-ratio:16/9;}

  .summary-card{background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.14); padding:28px 20px; text-align:center; margin-top:12px;}
  .summary-card h2{font-size:24px; margin:0 0 6px;}
  .summary-card .score{font-size:34px; font-weight:900; color:var(--purple); margin:10px 0;}
  .stars{font-size:30px; letter-spacing:4px; margin-bottom:14px;}
  .summary-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .summary-actions button{border:none; padding:11px 18px; border-radius:28px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
  .summary-actions button:active{transform:scale(.94);}
  .btn-primary{background:var(--purple); color:#fff;}
  .btn-secondary{background:#f0f0f6; color:var(--ink);}
  @media (prefers-reduced-motion: reduce){ .card.wrong-flash{animation:none;} .speak-btn.speaking{animation:none;} }
</style>

<div class="app">
  <button class="sound-toggle" id="soundToggle" aria-label="صوت">🔊</button>
  <header>
    <h1>أدوات طبيب الأسنان</h1>
    <p>اسمع السؤال واختر الصورة الصحيحة</p>
  </header>

  <section class="screen active" id="screen-levels">
    <div class="level-list">
      <div class="level-card" data-level="1">
        <div class="icon">🦷</div>
        <div class="txt"><h3>المستوى الأول</h3><p>اختر بين صورتين</p><div class="dots-mini" id="miniDots1"></div></div>
      </div>
      <div class="level-card" data-level="2">
        <div class="icon">🎯</div>
        <div class="txt"><h3>المستوى الثاني</h3><p>اختر بين ثلاث صور</p><div class="dots-mini" id="miniDots2"></div></div>
      </div>
    </div>
  </section>

  <section class="screen" id="screen-game">
    <div class="game-top">
      <button class="back-btn" id="backBtn" aria-label="رجوع">➡</button>
      <div class="progress" id="progressDots"></div>
    </div>
    <div class="game-area" id="gameArea">
      <div class="prompt-box">
        <button class="speak-btn" id="speakBtn" aria-label="أعد السؤال">🔊</button>
        <p>مَاذَا نَفْعَلُ بِأَدَوَاتِ طَبِيبِ الأَسْنَانِ؟</p>
      </div>
      <div class="cards-wrap" id="cardsWrap"></div>
    </div>
  </section>

  <section class="screen" id="screen-summary">
    <div class="summary-card">
      <h2>أحسنت! 🎉</h2>
      <div class="score" id="summaryScore">5 / 5</div>
      <div class="stars" id="summaryStars">⭐⭐⭐</div>
      <div class="summary-actions">
        <button class="btn-secondary" id="restartLevelBtn">إعادة المستوى</button>
        <button class="btn-primary" id="nextActionBtn">المستوى التالي</button>
      </div>
    </div>
  </section>
</div>

/* ===== الإعدادات ===== */
const TRIALS = 5;               // خمس تكرارات في كل مستوى
const WRONG_MARK_MS = 2000;     // ❌ تختفي بعد ثانيتين
const NEXT_DELAY_MS = 1500;     // الانتظار بعد انتهاء "ممتاز" قبل التكرار التالي
const START_DELAY_MS = 400;     // مهلة قصيرة قبل تشغيل السؤال
const LEVELS = {
  1: { images:[1,2],   correct:[2] },
  2: { images:[1,3,4], correct:[3,4] }
};

/* ===== صوت عالٍ وبدون تداخل ===== */
let ctx=null, gain=null, buffers={}, current=null, muted=false, audioReady=null;
function b64ToBuf(d){ const s=atob(d.split(',')[1]); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a.buffer; }
function initAudio(){
  if (audioReady){ if (ctx && ctx.state==='suspended') ctx.resume(); return audioReady; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC){ audioReady=Promise.resolve(); return audioReady; }
  ctx = new AC(); gain = ctx.createGain(); gain.gain.value = 1.0; gain.connect(ctx.destination);
  const s=ctx.createBufferSource(); s.buffer=ctx.createBuffer(1,1,22050); s.connect(ctx.destination); s.start(0);
  ctx.resume();
  audioReady = Promise.all(Object.keys(SND).map(k => new Promise(res => {
    try { ctx.decodeAudioData(b64ToBuf(SND[k]), b => { buffers[k]=b; res(); }, () => res()); } catch(e){ res(); }
  })));
  return audioReady;
}
const fallbackEls={};
function stopSound(){
  if (current){ try{ current.onended=null; if (current.stop) current.stop(); else { current.pause(); current.currentTime=0; } }catch(e){} current=null; }
  speakBtn.classList.remove('speaking');
}
function play(key){
  stopSound();
  return new Promise(resolve => {
    if (muted){ resolve(); return; }
    if (ctx && buffers[key]){
      if (ctx.state==='suspended') ctx.resume();
      const src=ctx.createBufferSource(); src.buffer=buffers[key]; src.connect(gain);
      current=src; src.onended=()=>{ if(current===src) current=null; resolve(); };
      src.start(0);
    } else {
      const el = fallbackEls[key] || (fallbackEls[key]=new Audio(SND[key]));
      el.volume=1; el.currentTime=0; current=el;
      el.onended=()=>{ if(current===el) current=null; resolve(); };
      el.play().catch(()=>resolve());
    }
  });
}

/* ===== اللعبة ===== */
const $ = id => document.getElementById(id);
const screens = { levels:$('screen-levels'), game:$('screen-game'), summary:$('screen-summary') };
const gameArea=$('gameArea'), cardsWrap=$('cardsWrap'), progressDots=$('progressDots'), speakBtn=$('speakBtn');
let level=1, trial=0, firstTry=0, triedWrong=false, busy=false, session=0, lastOrder='';
const bestDone={1:0,2:0};

function show(name){ Object.entries(screens).forEach(([k,el]) => el.classList.toggle('active', k===name)); window.scrollTo(0,0); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

function renderMini(){
  [1,2].forEach(l => { const el=$('miniDots'+l); el.innerHTML=''; for(let i=0;i<TRIALS;i++){ const s=document.createElement('span'); if(i<bestDone[l]) s.className='done'; el.appendChild(s);} });
}
function renderProgress(){
  progressDots.innerHTML='';
  for(let i=0;i<TRIALS;i++){ const s=document.createElement('span'); if(i<trial) s.className='done'; else if(i===trial) s.className='current'; progressDots.appendChild(s); }
}

function startLevel(l){
  session++; stopSound();
  level=l; trial=0; firstTry=0; lastOrder='';
  gameArea.className = 'game-area lvl-'+l;
  show('game');
  initAudio().then(()=>nextTrial(session));
}

async function nextTrial(s){
  if (s!==session) return;
  triedWrong=false; busy=false;
  renderProgress();
  let order; do { order=shuffle(LEVELS[level].images); } while(order.join()===lastOrder && order.length>1);
  lastOrder=order.join();
  cardsWrap.innerHTML='';
  order.forEach(n => {
    const c=document.createElement('div'); c.className='card'; c.dataset.n=n;
    const img=new Image(); img.src=IMG[n]; img.alt=''; img.draggable=false;
    const b=document.createElement('div'); b.className='badge'; b.textContent='✓';
    const x=document.createElement('div'); x.className='xmark'; x.innerHTML='<span>❌</span>';
    c.append(img,b,x);
    c.addEventListener('click', ()=>choose(c,s));
    cardsWrap.appendChild(c);
  });
  await wait(START_DELAY_MS);
  if (s!==session) return;
  askQuestion();
}

function askQuestion(){
  speakBtn.classList.add('speaking');
  play('q').then(()=>speakBtn.classList.remove('speaking'));
}

async function choose(card, s){
  if (busy || s!==session || card.classList.contains('locked')) return;
  const n=+card.dataset.n;
  if (LEVELS[level].correct.includes(n)){
    busy=true;
    if(!triedWrong) firstTry++;
    card.classList.add('correct'); card.querySelector('.badge').classList.add('show');
    cardsWrap.querySelectorAll('.card').forEach(c=>c.classList.add('locked'));
    await play('ok');               // ننتظر انتهاء "ممتاز" حتى لا تتداخل الأصوات
    await wait(NEXT_DELAY_MS);
    if (s!==session) return;
    trial++;
    if (trial>=TRIALS) finishLevel(); else nextTrial(s);
  } else {
    busy=true; triedWrong=true;
    const x=card.querySelector('.xmark');
    x.classList.add('show'); card.classList.add('wrong-flash');
    await Promise.all([play('no'), wait(WRONG_MARK_MS)]);
    if (s!==session) return;
    x.classList.remove('show'); card.classList.remove('wrong-flash');
    busy=false;
  }
}

function finishLevel(){
  bestDone[level]=TRIALS; renderMini();
  const stars = firstTry>=5 ? 3 : firstTry>=3 ? 2 : 1;
  $('summaryScore').textContent = firstTry+' / '+TRIALS;
  $('summaryStars').textContent = '⭐'.repeat(stars);
  $('nextActionBtn').textContent = level===1 ? 'المستوى التالي' : 'المستويات';
  show('summary');
}

document.querySelectorAll('.level-card').forEach(c => c.addEventListener('click', ()=>{ initAudio(); startLevel(+c.dataset.level); }));
speakBtn.addEventListener('click', ()=>{ initAudio(); if(!busy) askQuestion(); });
$('backBtn').addEventListener('click', ()=>{ session++; stopSound(); show('levels'); });
$('restartLevelBtn').addEventListener('click', ()=>{ initAudio(); startLevel(level); });
$('nextActionBtn').addEventListener('click', ()=>{ if(level===1){ initAudio(); startLevel(2); } else { show('levels'); } });
$('soundToggle').addEventListener('click', e=>{ muted=!muted; e.currentTarget.textContent = muted?'🔇':'🔊'; if(muted) stopSound(); });

Object.values(IMG).forEach(src=>{ const i=new Image(); i.src=src; });
renderMini();
</script>
    
  </body>
  
</html>
